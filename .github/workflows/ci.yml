name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build + test matrix — see swift-foundations/.github/.github/workflows/swift-ci.yml (layer wrapper)
  ci:
    uses: swift-foundations/.github/.github/workflows/swift-ci.yml@main
    with:
      # Per-platform root for Linux ([PLAT-ARCH-004]); Windows is not a
      # target this package can honestly build for (the Windows counterpart
      # is swift-windows). The apple legs stay: they build green today via
      # the platform gates.
      platform-support: apple,linux
    secrets: inherit

  # DocC umbrella-catalog pipeline per [DOC-019a] — see
  # swift-foundations/.github/.github/workflows/swift-docs.yml
  docs:
    uses: swift-foundations/.github/.github/workflows/swift-docs.yml@main
    secrets: inherit
